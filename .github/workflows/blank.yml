name: Build Kyriel Flash APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle atau settings.gradle.kts tidak ditemukan."
            echo ""
            echo "Isi repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project structure
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo ""

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo ""
          echo "Gradle files:"
          ls -la

          echo ""
          echo "Running Gradle..."

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah proses build."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Rename APK
        shell: bash
        run: |
          cp "$APK_PATH" "$GITHUB_WORKSPACE/KyrielFlash-debug.apk"

          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/KyrielFlash-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KyrielFlash-debug
          path: KyrielFlash-debug.apk
          if-no-files-found: error
